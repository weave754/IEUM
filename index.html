<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="경계선지능인 직원을 위한 단계별 업무 도우미"><meta name="theme-color" content="#0072B2"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2238 22 356 332%22%3E%3Cg fill=%22none%22 stroke=%22%234A9BD6%22 stroke-width=%2213%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M73 57H358%22/%3E%3Cpath d=%22M73 185C125 160 175 170 220 184S315 207 358 185%22/%3E%3Cpath d=%22M73 313C125 288 175 298 220 312S315 335 358 313%22/%3E%3C/g%3E%3Cg fill=%22%230072B2%22%3E%3Ccircle cx=%2273%22 cy=%2257%22 r=%2230%22/%3E%3Ccircle cx=%2273%22 cy=%22185%22 r=%2230%22/%3E%3Ccircle cx=%2273%22 cy=%22313%22 r=%2230%22/%3E%3C/g%3E%3Cg fill=%22%23E69F00%22%3E%3Ccircle cx=%22358%22 cy=%2257%22 r=%2230%22/%3E%3Ccircle cx=%22358%22 cy=%22185%22 r=%2230%22/%3E%3Ccircle cx=%22358%22 cy=%22313%22 r=%2230%22/%3E%3C/g%3E%3C/svg%3E"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>이음 | 업무도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 가운데 한 줄 앱 화면(최대 600px). 회색 바탕 위 흰 카드, 아래 떠 있는 탭바(5개). 진행 화면은 탭바 대신 아래 고정 버튼. */
:root{
  /* 색: Okabe–Ito 색약 친화 팔레트(파랑 #0072B2, 하늘 #56B4E9, 청록 #009E73, 주황 #E69F00, 주홍 #D55E00, 노랑 #F0E442)를 바탕으로,
     글자색은 WCAG AA(4.5:1), 아이콘·막대는 3:1 이상이 되도록 밝기만 조정했어요. 상태는 색만으로 구분하지 않고 글자·아이콘을 함께 써요. */
  --scale:1;
  --bg:#F2F4F6; --card:#FFFFFF; --sunk:#F2F4F6; --line:#DDE1E6;
  --ink:#191F28; --sub:#47505C; --mute:#5D6672;
  --brand:#0072B2; --brand-ink:#FFFFFF; --brand-soft:#E3F0F9; --brand-text:#005A8C;
  --ok:#00785A; --ok-soft:#E2F3EC; --on-ok:#FFFFFF;
  --warn:#8A5A00; --warn-soft:#FFF1D2;
  --danger:#B04400; --danger-soft:#FCE9DC;
  --gold:#B07800; --gold-soft:#FFF5D6;
  --room-wall:#E7EEF4; --room-floor:#D8DEE6; --room-line:#C5CDD8;
  --shadow:0 6px 24px rgba(15,35,60,.10);
  --focus:#0072B2;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16171B; --card:#212228; --sunk:#2A2B32; --line:#3A3C45;
  --ink:#ECEDF0; --sub:#BEC3CB; --mute:#A3A9B3;
  --brand:#56B4E9; --brand-ink:#061E2C; --brand-soft:#173246; --brand-text:#93D1F5;
  --ok:#3CC9A0; --ok-soft:#12352B; --on-ok:#04231A;
  --warn:#F2B544; --warn-soft:#3A2C12;
  --danger:#FF8F55; --danger-soft:#3E2216;
  --gold:#F0E442; --gold-soft:#36331A;
  --room-wall:#2C3442; --room-floor:#252B36; --room-line:#3B4454;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --focus:#93D1F5; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16171B; --card:#212228; --sunk:#2A2B32; --line:#3A3C45;
  --ink:#ECEDF0; --sub:#BEC3CB; --mute:#A3A9B3;
  --brand:#56B4E9; --brand-ink:#061E2C; --brand-soft:#173246; --brand-text:#93D1F5;
  --ok:#3CC9A0; --ok-soft:#12352B; --on-ok:#04231A;
  --warn:#F2B544; --warn-soft:#3A2C12;
  --danger:#FF8F55; --danger-soft:#3E2216;
  --gold:#F0E442; --gold-soft:#36331A;
  --room-wall:#2C3442; --room-floor:#252B36; --room-line:#3B4454;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --focus:#93D1F5; color-scheme:dark;
}
html{font-size:calc(18.5px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
h1:focus,h2:focus{outline:none}
.ic{width:1.4em;height:1.4em;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{max-width:600px;margin:0 auto;padding-inline:20px;padding-block:0 8.5rem;min-height:100vh}
.app.flow{padding-bottom:9rem}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:3.6rem;margin-inline:-20px;padding-inline:12px}
.wordmark{font-weight:700;letter-spacing:.14em;font-size:1.05rem;padding-inline:8px;display:flex;align-items:center;gap:8px}
.wordmark i{width:1.6rem;height:1.6rem;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:.85rem;letter-spacing:0}
.iconbtn{min-width:2.9rem;min-height:2.9rem;border:0;background:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-weight:500;padding-inline:8px}
.iconbtn:hover{background:var(--sunk)}
.stack{display:grid;gap:12px}
.gap-l{display:grid;gap:20px}
.head{display:grid;gap:4px;padding-block:8px 4px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(560px,calc(100% - 24px));display:flex;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:6px;z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:3.5rem;border:0;background:none;border-radius:20px;font-size:.76rem;font-weight:500;color:var(--mute)}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on .ic{color:var(--brand)}
.tabbar .ic{width:1.55rem;height:1.55rem}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.cta-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:8px}
.cta-in.one{grid-template-columns:1fr}

/* atoms */
.card{background:var(--card);border-radius:22px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:3.1rem;padding:.55rem 1.1rem;border-radius:14px;border:0;background:var(--sunk);font-weight:700;text-align:center;line-height:1.3;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.ghost{background:none;color:var(--brand-text);padding-inline:.6rem}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.big{min-height:3.5rem;font-size:1.08rem;border-radius:16px;width:100%}
.btn.small{min-height:2.5rem;padding:.3rem .8rem;font-size:.92rem;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.mute{color:var(--mute)}
.sub{color:var(--sub)}
.small{font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:4px;padding:.1rem .6rem;border-radius:8px;font-size:.82rem;font-weight:700;line-height:1.7;white-space:nowrap}
.pill .ic{width:1rem;height:1rem}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.gray{background:var(--sunk);color:var(--sub)}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:700;font-size:.95rem}
.input{width:100%;min-height:3.25rem;padding:.65rem 1rem;border:2px solid transparent;border-radius:14px;background:var(--sunk);font-size:1.05rem}
.input:focus{border-color:var(--brand);outline:none;background:var(--card)}
.input.oncard{background:var(--card)}
textarea.input{min-height:7rem;resize:vertical;line-height:1.6}
.unitwrap{display:flex;align-items:center;gap:8px}
.unitwrap .input{max-width:13rem;font-variant-numeric:tabular-nums}
.unit{font-weight:700;color:var(--sub)}
.hint{font-size:.9rem;color:var(--mute)}
.hint.hist{color:var(--brand-text);font-weight:500;display:flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:2.75rem;padding:.35rem 1rem;border-radius:999px;border:0;background:var(--card);font-weight:500;white-space:nowrap;color:var(--sub)}
.chip.insunk{background:var(--sunk)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.list{list-style:none;margin:0;padding:0;display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 4px;border:0;background:none;text-align:left;border-radius:14px}
button.li:hover{background:var(--sunk)}
.list>li+li{border-top:1px solid var(--line)}
.li .t{font-weight:700;display:block}
.li .m{font-size:.88rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.chev{color:var(--mute)}
.badge{width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.gray{background:var(--sunk);color:var(--sub)}
.badge .ic{width:1.35rem;height:1.35rem}
.note{border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.note>.ic{margin-top:.1rem}
.note.warn{background:var(--warn-soft)}
.note.warn>.ic{color:var(--warn)}
.note.info{background:var(--brand-soft)}
.note.info>.ic{color:var(--brand-text)}
.note.ok{background:var(--ok-soft)}
.note.ok>.ic{color:var(--ok)}
.note b{display:block}
.note>div{min-width:0;display:grid;gap:4px}
.bar{height:.6rem;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.gold i{background:var(--gold)}
.spot{width:5.5rem;height:5.5rem;border-radius:28px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center}
.spot .ic{width:2.8rem;height:2.8rem;stroke-width:1.7}
.flow{display:flex;align-items:flex-start;justify-content:center;gap:4px}
.flow .node{display:grid;justify-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--sub);text-align:center;min-width:0;flex:1}
.flow .node .badge{width:3rem;height:3rem;border-radius:16px}
.flow .arrow{color:var(--mute);flex:none;margin-top:.9rem}
.flow .arrow .ic{width:1rem;height:1rem}

/* home */
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:5.8rem;height:5.8rem;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.25rem;font-variant-numeric:tabular-nums}
.ring b span{display:grid;justify-items:center;line-height:1.15}
.ring b small{display:block;font-size:.7rem;color:var(--mute);font-weight:500}
.lvstrip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;text-align:left}
.lvnum{font-weight:700;color:var(--brand-text);background:var(--brand-soft);border-radius:12px;padding:.35rem .7rem;white-space:nowrap;font-variant-numeric:tabular-nums}

/* task */
.stepchain{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.stepchain::-webkit-scrollbar{display:none}
.sc{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:12px;background:var(--card);color:var(--mute);border:0;flex:none;padding:0}
.sc .ic{width:1.2rem;height:1.2rem}
.sc.done{background:var(--ok-soft);color:var(--ok)}
.sc.cur{background:var(--brand);color:var(--brand-ink)}
.sc.insunk{background:var(--sunk)}
.sc-line{width:10px;height:2px;background:var(--line);flex:none}
.stephead{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:6px 2px}
.stephead h2{font-size:1.5rem}
.how{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:10px;font-size:1.08rem;align-items:start}
.how li::before{content:counter(h);width:1.9rem;height:1.9rem;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.exbox{background:var(--card);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.card .exbox{background:var(--sunk)}
.extext{white-space:pre-wrap;font-weight:500}
.tip{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:flex;gap:8px;align-items:flex-start}
.tip .ic{color:var(--warn);margin-top:.1rem}
.src{display:inline-flex;gap:4px;align-items:center;font-size:.82rem;color:var(--brand-text);background:var(--brand-soft);border-radius:8px;padding:.05rem .5rem;font-weight:500}
.src .ic{width:1rem;height:1rem}
.check{display:flex;align-items:center;gap:12px;min-height:3.25rem;padding:.5rem 1rem;border-radius:14px;background:var(--card);font-weight:500}
.card .check{background:var(--sunk)}
.check>.ic{color:var(--ok)}
.check input{width:1.45rem;height:1.45rem;accent-color:var(--ok);flex:none}
.check:has(input:checked){background:var(--ok-soft)}
.confirm-list{list-style:none;margin:0;padding:0;display:grid}
.confirm-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.confirm-list li:last-child{border-bottom:0}
.confirm-list .k{font-size:.86rem;color:var(--mute);display:block}
.confirm-list .v{font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.confirm-list .v.empty{color:var(--warn);font-weight:500}
.answer p,.bub p{margin:0 0 .4rem}
.answer ol,.answer ul,.bub ol,.bub ul{margin:.1rem 0 .5rem;padding-left:1.3rem;display:grid;gap:2px}

/* done */
.celebrate{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:24px 4px}
.bigcheck{width:5.5rem;height:5.5rem;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center}
.bigcheck .ic{width:3rem;height:3rem;stroke-width:2.6}
.xpline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.xpline:last-child{border-bottom:0}
.xpline b{color:var(--warn);font-variant-numeric:tabular-nums}
.xptotal{font-size:2rem;font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .bigcheck{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .bar i.grow{animation:grow .9s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes grow{from{width:0}}
}

/* add */
.tplgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl{display:grid;gap:8px;text-align:left;padding:14px;border-radius:18px;border:2px solid transparent;background:var(--card);min-height:6rem;align-content:start}
.tpl.insunk{background:var(--sunk)}
.tpl[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.tpl b{line-height:1.3;font-size:.98rem}
.tpl .badge{width:2.3rem;height:2.3rem;border-radius:12px}
.numhead{display:flex;align-items:center;gap:8px}
.numhead .n{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.genlist{margin:0;padding-left:1.3rem;display:grid;gap:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:none;text-align:left;padding:0}
.switch .tg{width:3.1rem;height:1.85rem;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tg::after{content:"";position:absolute;top:3px;left:3px;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] .tg{background:var(--brand)}
.switch[aria-checked="true"] .tg::after{transform:translateX(1.25rem)}

/* brief / messages */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{background:var(--sunk);border-radius:12px;padding:8px 10px;min-width:0}
.kv .k{font-size:.8rem;color:var(--mute);display:block}
.kv .v{font-weight:700;font-size:.95rem}
.kv .v.unknown{color:var(--warn);font-weight:500}
.say{font-weight:500;font-size:1.03rem}
.qitem{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}

/* chat */
.chat{display:grid;gap:10px}
.bub{max-width:88%;padding:12px 15px;border-radius:20px;display:grid;gap:4px}
.bub.me{justify-self:end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.bub.ai{justify-self:start;background:var(--card);border-bottom-left-radius:6px}
.bub.err{box-shadow:inset 0 0 0 2px var(--warn-soft)}
.added{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem;background:var(--ok-soft);border-radius:12px;padding:6px 10px;justify-self:start;max-width:88%}
.added .ic{color:var(--ok);width:1.1rem;height:1.1rem}
.added.mem{background:var(--brand-soft)}
.added.mem .ic{color:var(--brand-text)}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 5.8rem);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--shadow);z-index:5}
.composer textarea{min-height:3rem;max-height:9rem;border:0;background:none;padding:.6rem .7rem;resize:none}
.composer textarea:focus{background:none;border:0}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--mute)}
.thinking i{width:.45rem;height:.45rem;border-radius:50%;background:currentColor;opacity:.35}
@media (prefers-reduced-motion:no-preference){.thinking i{animation:blink 1.2s infinite}.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}@keyframes blink{50%{opacity:1}}}

/* rights infographic */
.ibars{display:grid;gap:10px}
.ibar{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:10px;align-items:center;font-size:.92rem}
.ibar .track{height:2.1rem;border-radius:10px;background:var(--sunk);overflow:hidden;display:flex}
.ibar .work{background:var(--brand-soft);height:100%;display:grid;place-items:center;color:var(--brand-text);font-size:.8rem;font-weight:500}
.ibar .rest{background:var(--ok);height:100%;display:grid;place-items:center;color:var(--on-ok);font-weight:700;font-size:.8rem;white-space:nowrap}
.bigfact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding-block:4px}
.bigfact .num{font-size:2rem;font-weight:700;color:var(--brand-text);line-height:1.1;font-variant-numeric:tabular-nums}
.phone-num{font-size:1.6rem;font-weight:700;letter-spacing:.04em;user-select:all}

/* words/logs */
.witem{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.witem:last-child{border-bottom:0}
.witem .w{font-size:1.12rem;font-weight:700}
.witem .ex{color:var(--mute);font-size:.92rem}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals span{background:var(--sunk);border-radius:8px;padding:.1rem .55rem;font-size:.86rem}
.report{white-space:pre-wrap;background:var(--sunk);border-radius:14px;padding:14px;margin:0;font-family:var(--font);font-size:.95rem}
.diff del{color:var(--danger);text-decoration:line-through}
.diff ins{color:var(--ok);text-decoration:none;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg label{display:grid;place-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--sunk);font-weight:700;text-align:center;min-height:4.2rem;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus)}
.drop{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px 16px;border:2px dashed var(--line);border-radius:20px;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}

/* room */
.room{max-width:560px;width:100%;margin-inline:auto}
.room svg{width:100%;height:auto;display:block;border-radius:18px}
.skill{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.lvtag{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lvtag .arrow{color:var(--mute);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6.4rem);background:var(--ink);color:var(--bg);padding:.75rem 1.2rem;border-radius:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.dialog{background:var(--card);border-radius:22px;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.card .dialog{box-shadow:none;background:var(--sunk);padding:16px}
.dialog .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){h1{font-size:1.4rem}.kv{grid-template-columns:1fr}}

/* 회사(관리자) 연동 */
.meet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:12px 0}
.meet+.meet{border-top:1px solid var(--line)}
.mdate{display:grid;justify-items:center;width:3.6rem;padding:6px 0;border-radius:14px;background:var(--brand-soft);color:var(--brand-text);line-height:1.2}
.mdate b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.mdate small{font-size:.74rem;font-weight:500}
.meet.past .mdate{background:var(--sunk);color:var(--mute)}
.av{width:2rem;height:2rem;border-radius:50%;flex:none;object-fit:cover;background:var(--sunk)}
.chip .av{width:1.5rem;height:1.5rem;margin-left:-.4rem}
.chip.withav{display:inline-flex;align-items:center;gap:6px}
.who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0}
.who+.who{border-top:1px solid var(--line)}
.who .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepedit{display:grid;gap:10px;padding:14px;border-radius:18px;background:var(--sunk)}
.stepedit .input{background:var(--card)}
.stepedit .input:focus{background:var(--card)}
.stepedit textarea.input{min-height:4.6rem}
.stepedit .sn{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
select.input{cursor:pointer}
.adm-pill{letter-spacing:0;font-size:.74rem}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* 첫 화면(로그인·회사 고르기) */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-in{max-width:480px;margin:0 auto;display:grid;gap:16px}
.gate-brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;font-size:1.05rem}
.gate-brand i{width:1.7rem;height:1.7rem;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:.85rem;letter-spacing:0}
.gate-code{font-size:2.2rem;font-weight:700;letter-spacing:.3em;font-variant-numeric:tabular-nums;user-select:all;color:var(--brand-text)}

/* 단계 안내: 보기 전환, 도움 수준, 펼쳐 보기 */
.viewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg2{display:inline-flex;background:var(--card);border-radius:12px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:10px;padding:.3rem .85rem;min-height:2.6rem;font-weight:500;color:var(--sub);font-size:.94rem}
.seg2 button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.lvopt{display:grid;gap:2px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:var(--sunk);line-height:1.45}
.lvopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.lvopt .pill{vertical-align:2px}
.hintline{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.hintline>.ic{color:var(--brand-text);margin-top:.15rem}
.tip b,.hintline b{margin-right:4px}
.more{display:grid;gap:8px}
details.more-d{background:var(--card);border-radius:16px}
.card details.more-d,.pbody details.more-d{background:var(--sunk)}
details.more-d>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:3rem;padding:.4rem 14px;font-weight:700;color:var(--brand-text);border-radius:16px}
details.more-d>summary::-webkit-details-marker,.pstep>details>summary::-webkit-details-marker{display:none}
details.more-d>summary .dchev{width:1rem;height:1rem;transition:transform .15s;flex:none}
details.more-d[open]>summary .dchev{transform:rotate(90deg)}
details.more-d.warn-d>summary{color:var(--warn)}
details.more-d.card-d{border-radius:22px}
details.more-d.card-d>summary{padding:.6rem 20px;min-height:3.4rem;color:var(--ink);font-size:1.05rem}
.more-b{padding:0 16px 14px;display:grid;gap:8px}
details.card-d .more-b{padding:0 20px 18px}
.ck2{align-items:flex-start;padding-block:.75rem}
.ck2 input{margin-top:.2rem}
.ckt{display:grid;gap:3px;min-width:0}
.ckh{font-size:.9rem;color:var(--sub);font-weight:400;line-height:1.5}
.peek{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* 전체 과정 보기 */
.proc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pstep>details{background:var(--card);border-radius:20px}
.pstep.cur>details{box-shadow:inset 0 0 0 2px var(--brand)}
.pstep>details>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;min-height:3.6rem;border-radius:20px}
.pnum{width:2.2rem;height:2.2rem;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--sub);font-variant-numeric:tabular-nums}
.pnum .ic{width:1.1rem;height:1.1rem}
.pstep.done .pnum{background:var(--ok-soft);color:var(--ok)}
.pstep.cur .pnum{background:var(--brand);color:var(--brand-ink)}
.pstep.done .ptitle{color:var(--sub)}
.ptitle{font-weight:700;min-width:0}
.pbody{padding:0 16px 16px;display:grid;gap:12px}
.pbody .card,.pbody .exbox,.pbody .check,.pbody .hintline{background:var(--sunk)}
.pbody .card{padding:16px}
.pbody .card .input,.pbody .card .input:focus{background:var(--card)}
.pbody .card .exbox{background:var(--card)}
/* 도움 요청 */
.helpopts{display:grid;gap:8px}
.hopt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:3.1rem;padding:.5rem 14px;border-radius:14px;border:2px solid transparent;background:var(--sunk);font-weight:500;color:var(--ink)}
.hopt>.ic{color:var(--brand-text)}
.hopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text);font-weight:700}
/* 성장 */
.lvseq{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.lvc{display:inline-flex;align-items:center;justify-content:center;min-width:3.2rem;padding:.1rem .55rem;border-radius:8px;font-size:.84rem;font-weight:700;line-height:1.8}
.lvc.l2{background:var(--sunk);color:var(--sub)}
.lvc.l1{background:var(--brand-soft);color:var(--brand-text)}
.lvc.l0{background:var(--ok-soft);color:var(--ok)}
.lvseq .arr{color:var(--mute);font-size:.85rem}
.goal{display:grid;gap:6px;padding:12px 0}
.goal+.goal{border-top:1px solid var(--line)}
.goal .small .ic{width:1em;height:1em;vertical-align:-2px;color:var(--ok)}
.fb{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.fb+.fb,.wkbars+p+.fb{border-top:1px solid var(--line)}
.fb>.ic{color:var(--brand-text);margin-top:.2rem}
.wkbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;height:8.5rem;padding-top:4px}
.wk{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;height:100%}
.wkn{font-weight:700;font-variant-numeric:tabular-nums}
.wkb{width:60%;max-width:3rem;height:100%;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--brand);border-radius:8px 8px 0 0;min-height:2px}
.wkl{font-size:.8rem;color:var(--mute);white-space:nowrap}

/* ===== 이음: 시각 중심 정리 ===== */
:root{interpolate-size:allow-keywords}
/* 브랜드 표기: 이음 | 업무도우미 */
.wordmark,.sidebrand,.gate-brand{letter-spacing:.02em!important}
.wordmark i,.sidebrand i,.gate-brand i{font-size:.82rem}
.wm-sub{font-weight:500;color:var(--mute);font-size:.82rem;letter-spacing:0;margin-left:2px}
/* 부드럽게 펼쳐지는 토글 (지원하는 브라우저에서) */
details.more-d::details-content,.pstep>details::details-content{block-size:0;overflow:hidden;transition:block-size .22s ease,content-visibility .22s allow-discrete}
details.more-d[open]::details-content,.pstep>details[open]::details-content{block-size:auto}
@media (prefers-reduced-motion:reduce){details.more-d::details-content,.pstep>details::details-content{transition:none}}
details.more-d>summary:hover{background:var(--brand-soft)}
details.more-d.flat-d{background:none}
details.more-d.flat-d>summary{padding-inline:4px;color:var(--sub)}
details.more-d.flat-d .more-b{padding-inline:0}
.pstep>details>summary{grid-template-columns:auto minmax(0,1fr) auto auto}
.pstep>details>summary .dchev{width:1rem;height:1rem;color:var(--mute);transition:transform .2s}
.pstep>details[open]>summary .dchev{transform:rotate(90deg)}
/* 단계 흐름: [아이콘 단계] → [아이콘 단계] */
.flowbar{position:relative;overflow-x:auto;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.flowbar::-webkit-scrollbar{display:none}
.layout-pc .flowbar{margin-inline:0;padding-inline:0}
.flowbar ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px;width:max-content}
.fs{display:flex;align-items:center;gap:6px}
.fa{color:var(--mute);font-weight:700}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:2.6rem;padding:.3rem .85rem;border-radius:999px;background:var(--card);color:var(--sub);font-size:.92rem;font-weight:500;border:0;white-space:nowrap}
.fchip .ic{width:1.1rem;height:1.1rem}
button.fchip:hover{box-shadow:inset 0 0 0 2px var(--ok)}
.fs.done .fchip{background:var(--ok-soft);color:var(--ok)}
.fs.cur .fchip{background:var(--brand);color:var(--brand-ink);font-weight:700}
/* 지금 단계 */
.stephead{gap:6px}
.stephead h2{font-size:1.65rem}
.spot{width:4.4rem;height:4.4rem;border-radius:22px}
.spot .ic{width:2.2rem;height:2.2rem}
/* 이렇게 해요 / 조심해요 / 말할 예문: 눈으로 구분 */
.blk{border-radius:18px;padding:14px 16px;display:grid;gap:8px;background:var(--card)}
.blk-h{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem;color:var(--sub)}
.blk-h .ic{width:1.15rem;height:1.15rem}
.blk-do{box-shadow:inset 4px 0 0 var(--brand)}
.blk-do .blk-h{color:var(--brand-text)}
.blk-do .how li{font-size:1.12rem}
.blk-main{font-size:1.08rem;font-weight:500}
.blk-warn{background:var(--warn-soft)}
.blk-warn .blk-h{color:var(--warn)}
.pbody .blk{background:var(--sunk)}
.pbody .blk-warn{background:var(--warn-soft)}
.ckh .ic{width:1em;height:1em;vertical-align:-2px;margin-right:4px}
/* 안내 정도 고르기 */
.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvtile{display:grid;justify-items:center;align-content:start;gap:4px;padding:14px 6px;border-radius:16px;border:2px solid transparent;background:var(--sunk);text-align:center;color:var(--ink);min-height:6.4rem}
.lvtile>.ic{width:1.6rem;height:1.6rem;color:var(--brand-text)}
.lvtile b{font-size:1rem}
.lvtile>span:not(.pill){font-size:.84rem;color:var(--sub)}
.lvtile[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
/* 홈 */
.hero-t{font-size:1.35rem}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qcard{display:grid;gap:10px;justify-items:start;align-content:start;padding:16px;border-radius:20px;border:0;background:var(--card);text-align:left;min-height:6.2rem;color:var(--ink)}
.qcard b{font-size:1rem}
.qcard:hover{box-shadow:inset 0 0 0 2px var(--brand-soft)}
/* 지시 정리 */
.bmgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bmcard{display:grid;gap:8px;align-content:start;padding:14px;border-radius:16px;background:var(--sunk);min-width:0}
.bmcard .input,.bmcard .input:focus{background:var(--card)}
.bm-h{display:flex;align-items:center;gap:8px;font-weight:700}
.bm-h .badge{width:2.2rem;height:2.2rem;border-radius:12px}
.ikv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ikv>div{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px;min-width:0}
.ikv>div>.ic{color:var(--brand-text);width:1.2rem;height:1.2rem;margin-top:.15rem}
.ikv .k{display:block;font-size:.8rem;color:var(--mute)}
.ikv .v{display:block;font-weight:700;font-size:.95rem}
.ikv .unknown .v,.ikv .unknown>.ic{color:var(--warn)}
h3.row .badge,h2.row .ic{flex:none}
h3.row .badge{width:2rem;height:2rem;border-radius:10px}
/* 물어보기 */
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kcard{display:grid;gap:8px;justify-items:start;align-content:start;text-align:left;padding:14px;border-radius:18px;border:0;background:var(--card);color:var(--ink);min-width:0}
.kcard>span:last-child{font-size:.88rem;color:var(--sub)}
.kcard:hover{box-shadow:inset 0 0 0 2px var(--brand-soft)}
/* 성장: 1열 */
.gt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gt-lv{display:grid}
.gt-lv b{font-size:2.6rem;line-height:1.05;color:var(--brand-text);font-variant-numeric:tabular-nums}
.gt-stats{display:flex;gap:20px}
.gt-stats>div{display:grid;justify-items:center}
.gt-stats b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.gt-stats span{font-size:.8rem;color:var(--mute)}
.bar.thick{height:.9rem}
.sklist{list-style:none;margin:0;padding:0;display:grid}
.skrow{display:grid;grid-template-columns:auto minmax(0,7rem) auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 0}
.skrow+.skrow{border-top:1px solid var(--line)}
.skn{font-weight:700}
.goal b>.ic{width:1.05em;height:1.05em;vertical-align:-2px;color:var(--brand-text)}
@media (max-width:520px){
  .bmgrid,.kgrid{grid-template-columns:1fr}
  .kcard{grid-template-columns:auto minmax(0,1fr);align-items:center}
  .kcard>span:last-child{grid-column:1/-1}
}
@media (max-width:420px){
  .ikv{grid-template-columns:1fr}
  .skrow{grid-template-columns:auto minmax(0,1fr) auto}
  .skrow .bar{grid-column:2/-1}
  .gt-stats{gap:14px}
}
@media (max-width:760px){.layout-pc .sidebrand .wm-sub{display:none}}

/* 이음 로고: 파란 점과 주황 점을 잇는 세 줄 (글자·바탕 없음) */
.logo{display:inline-grid;line-height:0;flex:none}
.logo svg{height:2.2rem;width:auto;display:block}
.logo-lg svg{height:4.2rem}
.layout-pc .sidebrand .logo svg{height:2.6rem}
.gate-brand .logo svg{height:3rem}
.wm-sub{white-space:nowrap}
.layout-pc .sidebrand{flex-wrap:wrap;row-gap:6px}
@media (max-width:760px){.layout-pc .sidebrand .logo small{display:none}.layout-pc .sidebrand .logo{padding:.3em .4em}}
@media (max-width:360px){.wordmark .wm-sub{display:none}}
.gap-l{grid-template-columns:minmax(0,1fr)}
@media (max-width:380px){.flow .arrow{display:none}.flow{gap:2px}}

/* 화면 모양: 휴대폰(기본) / 컴퓨터(왼쪽 메뉴 + 두 칸) */
.sidebrand{display:none}
.split,.split>.col{display:contents}
.seg.two{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg .ic{width:1.6rem;height:1.6rem}
:root.layout-pc{--side:240px}
.layout-pc body{padding-left:var(--side)}
.layout-pc .app{max-width:1100px;padding-inline:32px;padding-block:0 4rem}
.layout-pc .app.flow{padding-bottom:8rem}
.layout-pc .topbar{margin-inline:-32px;padding-inline:20px;min-height:4rem}
.layout-pc .topbar .wordmark{visibility:hidden}
.layout-pc .tabbar{left:0;top:0;bottom:0;transform:none;width:var(--side);flex-direction:column;justify-content:flex-start;gap:4px;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
.layout-pc .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:3.1rem;padding:0 14px;border-radius:14px;font-size:1rem}
.layout-pc .tabbar button:hover{background:var(--sunk)}
.layout-pc .tabbar button.on{background:var(--brand-soft);color:var(--brand-text)}
.layout-pc .tabbar .ic{width:1.4rem;height:1.4rem}
.layout-pc .sidebrand{display:flex;align-items:center;gap:8px;padding:8px 14px 20px;font-weight:700;letter-spacing:.14em;font-size:1.05rem}

function applyExtra(steps,ex){(ex||[]).forEach((e,i)=>{const s=steps[i];if(!s||!e)return;
  if(e.why&&!s.why)s.why=e.why;if(e.exam&&!s.exam)s.exam=e.exam;if(e.ch&&!(s.checkHelp&&s.checkHelp.length))s.checkHelp=e.ch.slice();
  if(e.fh)(s.fields||[]).forEach(f=>{if(e.fh[f.k]&&!f.hint)f.hint=e.fh[f.k];});});}
TEMPLATES.forEach(tp=>applyExtra(tp.steps,STEP_EXTRA[tp.id]));applyExtra(GENERIC_STEPS,STEP_EXTRA.generic);
/* 예전에 만든 할 일에도 보충 설명을 채워 줘요 (같은 템플릿, 같은 단계 이름일 때만) */
function backfillTask(t){const tp=t.tplId&&!String(t.tplId).startsWith('p:')?TEMPLATES.find(x=>x.id===t.tplId):null;if(!tp)return;
  t.steps.forEach((s,i)=>{const b=tp.steps[i];if(!b||b.title!==s.title)return;
    if(!s.why&&b.why)s.why=b.why;if(!s.exam&&b.exam)s.exam=b.exam;if(!(s.checkHelp&&s.checkHelp.length)&&b.checkHelp)s.checkHelp=b.checkHelp.slice();
    (s.fields||[]).forEach(f=>{const bf=(b.fields||[]).find(x=>x.k===f.k);if(bf&&bf.hint&&!f.hint)f.hint=bf.hint;});});}

 {id:'bully',icon:'shield',title:'무시하거나 괴롭힐 때',when:'욕설, 따돌림, 계속 무시할 때',

 {id:'pay',icon:'wallet',title:'월급이 이상할 때',when:'돈이 덜 들어온 것 같을 때',infographic:'pay',

async function getManualText(id){if(manualCache[id]!=null)return manualCache[id];let t=null;
  if(String(id).startsWith('g-')){if(DB&&ORGP()){try{const s=await DB.doc(ORGP()+'/gtext/'+id.slice(2)).get();if(s.exists)t=s.data().text;}catch(e){}}

function grams(s){const out=new Set();String(s).replace(/[^\p{L}\p{N}]+/gu,' ').split(' ').filter(w=>w.length>=2).forEach(w=>{for(let i=0;i<w.length-1;i++)out.add(w.slice(i,i+2).toLowerCase());});return [...out];}
const scoreOf=(c,g)=>{const lc=c.toLowerCase();let sc=0;g.forEach(x=>{if(lc.includes(x))sc++;});return sc;};
async function manualContext(query,maxChars=12000,onlyId=null){
  const all=allManuals();
  if(!all.length||(!S.useManual&&!onlyId))return null;
  const list=onlyId?all.filter(m=>m.id===onlyId):all;
  const texts=[];let total=0;for(const m of list){const t=await getManualText(m.id);if(t){texts.push({m,t});total+=t.length;}}
  if(!texts.length)return null;
  const g=grams(query);
  if(total<=maxChars)return{names:texts.map(x=>x.m.name),text:texts.map(x=>`[${x.m.name}]\n${x.t}`).join('\n---\n')};
  const chunks=[];texts.forEach(({m,t})=>{for(let i=0;i<t.length;i+=1100){const c=t.slice(i,i+1300);chunks.push({m,c,i,sc:scoreOf(c,g)});}});
  const pick=[];let n=0;for(const ch of chunks.slice().sort((a,b)=>b.sc-a.sc||a.i-b.i)){if(n+ch.c.length>maxChars)break;pick.push(ch);n+=ch.c.length;}
  pick.sort((a,b)=>a.m.name.localeCompare(b.m.name)||a.i-b.i);
  return{names:[...new Set(pick.map(p=>p.m.name))],text:pick.map(p=>`[${p.m.name}]\n${p.c}`).join('\n---\n')};
}

function syncAssigned(){if(!storeReady||!ME)return;let added=0,changed=0,gone=0;const since=Date.now()-30*864e5;

function md(t){const lines=esc(t).split('\n');let html='',list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close=()=>{if(list){html+='</'+list+'>';list=null;}};
  for(const raw of lines){const l=raw.trim();let m;
    if((m=l.match(/^(\d+)[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol';}html+='<li>'+inl(m[2])+'</li>';}
    else if((m=l.match(/^[-*•]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul';}html+='<li>'+inl(m[1])+'</li>';}
    else{close();if(l)html+='<p>'+inl(l.replace(/^#+\s*/,'')).replace(/^([^\p{L}\p{N}\s<&]+\s*)([\p{L} ]{2,14})(:)/u,'$1<strong>$2</strong>$3')+'</p>';}}
  close();return html;}

function histKey(task,f){if(!f.hist)return null;for(const s of task.steps)for(const g of s.fields)if(g.k===f.hist&&String(g.value).trim())return normTitle(g.value);return null;}
const histFor=(task,f)=>{const k=histKey(task,f);return k&&S.history[k]?S.history[k]:[];};
function issuesFor(task,step){const out=[];
  step.fields.forEach((f,fi)=>{const v=String(f.value??'').trim();
    if(!v){out.push({fi,msg:`‘${f.label}’ 칸이 비어 있어요.`});return;}
    if(f.type==='number'){const n=num(v);
      if(isNaN(n)){out.push({fi,msg:`‘${f.label}’에는 숫자만 적어요.`});return;}
      const h=histFor(task,f);
      if(h.length){const avg=h.reduce((a,b)=>a+b,0)/h.length,lo=Math.min(...h),hi=Math.max(...h),u=f.unit||'';
        if(n>=avg*2)out.push({fi,warn:true,msg:`${josa(fmtNum(n)+u,'은/는')} 평소(${fmtNum(lo)}~${fmtNum(hi)}${u})보다 훨씬 많아요. 0을 더 썼는지 확인해요.`});
        else if(n<=avg/2)out.push({fi,warn:true,msg:`${josa(fmtNum(n)+u,'은/는')} 평소(${fmtNum(lo)}~${fmtNum(hi)}${u})보다 훨씬 적어요.`});}}
    if(f.type==='date'&&v<todayStr())out.push({fi,msg:`‘${f.label}’에 지난 날짜를 적었어요.`});
    if(f.type==='tel'){const d=v.replace(/\D/g,'');if(d.length<9||d.length>11)out.push({fi,msg:`전화번호가 ${d.length}자리예요. 다시 들어 봐요.`});}
    if(f.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))out.push({fi,msg:'메일 주소에 @와 점(.)이 있는지 봐요.'});
  });
  step.checks.forEach((c,i)=>{if(!step.checked[i])out.push({ci:i,msg:`‘${c}’에 체크해요.`});});
  return out;}

function ring(done,total){const r=40,c=2*Math.PI*r,p=total?done/total:0;
  return `<div class="ring" role="img" aria-label="할 일 ${total}개 중 ${done}개 끝"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="12"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><b><span>${done}/${total}<small>끝냈어요</small></span></b></div>`;}

  h+=`<button class="card lvstrip" data-act="nav" data-to="grow"><span class="lvnum">Lv.${tl.lv}</span><span style="display:grid;gap:6px"><span class="small sub">${tl.max?'가장 높은 레벨이에요':`다음 레벨까지 ${tl.toNext} XP`}</span><span class="bar gold"><i style="width:${tl.pct}%"></i></span></span>${ic('right','chev')}</button>`;
  if(IS_ADMIN)h+=`<div class="note info">${ic('case')}<div><b>관리자 미리보기</b><span class="small">‘모든 직원’에게 보낸 일이 여기에도 들어와요.</span></div></div>`;

function taskRow(t){const n=Math.min(t.current,t.steps.length);
  const b=t.status==='done'?`<span class="badge ok">${ic('check')}</span>`:`<span class="badge ${t.status==='doing'?'':'gray'}">${ic((t.steps[Math.min(t.current,t.steps.length-1)]||{}).pic||'check')}</span>`;
  return `<li><button class="li" data-act="open" data-id="${t.id}">${b}<span><span class="t" ${t.status==='done'?'style="color:var(--mute)"':''}>${esc(t.title)}</span><span class="m">${t.status==='done'?'끝냈어요':`${n}/${t.steps.length}단계 · ${esc(t.due)}`}${t.urgent&&t.status!=='done'?' <span class="pill red">급해요</span>':''}${t.fromBoss&&t.status!=='done'&&!t.canceled?` <span class="pill brand">${t.changed?'바뀌었어요':'받은 일'}</span>`:''}${t.canceled&&t.status!=='done'?' <span class="pill gray">취소됨</span>':''}</span></span>${ic('right','chev')}</button></li>`;}

/* 펼쳐 보기 (열림 상태는 ui.openSet에 기억해요) */
const det=(key,label,body,cls='')=>`<details class="more-d ${cls}" data-open="${esc(key)}" ${ui.openSet.has(key)?'open':''}><summary>${ic('right','dchev')}<span>${label}</span></summary><div class="more-b">${body}</div></details>`;
/* 단계 흐름: [아이콘 단계] → [아이콘 단계] → [확인] */
function flowBar(t){const n=t.steps.length,cur=t.current;
  return `<nav class="flowbar" aria-label="단계 흐름"><ol>${t.steps.map((s,i)=>{const k=i<cur?'done':i===cur?'cur':'next';
    const inner=`${ic(i<cur?'check':s.pic)}<span>${esc(s.title)}</span>`,lab=`${i+1}단계 ${s.title}, ${k==='done'?'했어요':k==='cur'?'지금 단계':'다음 단계'}`;
    return `<li class="fs ${k}">${i?'<span class="fa" aria-hidden="true">→</span>':''}${i<cur?`<button class="fchip" data-act="jump" data-i="${i}" aria-label="${esc(lab)}. 눌러서 돌아가기">${inner}</button>`:`<span class="fchip" ${i===cur?'aria-current="step"':''} aria-label="${esc(lab)}">${inner}</span>`}</li>`;}).join('')}
    <li class="fs ${cur>=n?'cur':'next'}"><span class="fa" aria-hidden="true">→</span><span class="fchip" ${cur>=n?'aria-current="step"':''}>${ic('star')}<span>마지막 확인</span></span></li></ol></nav>`;}
function vTask(){
  const t=curTask();if(!t){ui.view='home';return vHome();}
  if(t.status==='done')return vTaskDone(t);
  const n=t.steps.length,cur=t.current,all=S.settings.taskView==='all';
  let h=topbar(t.title,'home',`<button class="iconbtn" data-act="toggleMore" aria-label="더 보기" aria-expanded="${ui.more}">${ic('more')}</button>`)+`<div class="gap-l">`;
  if(ui.more)h+=ui.confirm==='del'?dialog('이 일을 지울까요?','지우면 되돌릴 수 없어요.','delTask','지우기'):
    `<div class="card stack"><button class="btn" data-act="restart">${ic('redo')}처음부터 다시 하기</button><button class="btn danger" data-act="askDel">${ic('trash')}이 일 지우기</button></div>`;
  h+=`<div class="stack" style="gap:10px"><div class="row between"><span class="pill brand">${cur>=n?'마지막 확인':`${cur+1} / ${n}단계`}</span><span class="small sub row" style="gap:4px">${ic('clock')}${esc(t.due)}</span></div>`;
  if(cur<n)h+=`<div class="viewbar"><div class="seg2" role="group" aria-label="보는 방법"><button data-act="setView" data-v="one" aria-pressed="${!all}">한 단계씩</button><button data-act="setView" data-v="all" aria-pressed="${all}">전체 과정</button></div><button class="btn small ghost" data-act="toggleLv" aria-expanded="${!!ui.lvOpen}">${ic('sliders')}안내: ${LEVELS[taskLv(t)].short}</button></div>`;
  if(!all||cur>=n)h+=flowBar(t);
  h+=`</div>`;
  if(cur<n&&(ui.lvOpen||(t.status==='todo'&&cur===0&&!t.lvSet)))h+=lvPicker(t);
  if(t.canceled)h+=`<div class="note warn">${ic('warn')}<div><b>상사가 이 일을 취소했어요.</b><span class="small">더 하지 않아도 돼요. 오른쪽 위 더 보기에서 지울 수 있어요.</span></div></div>`;
  if(t.note||t.fromBoss)h+=`<div class="note info">${ic('brief')}<div>${t.fromBoss?`<b>${t.changed?'상사가 내용을 바꿨어요.':'상사가 보낸 일이에요.'}</b>`:''}${t.note?`<span>${esc(t.note)}</span>`:''}</div></div>`;
  if(t.manual&&cur<n)h+=`<span class="src" style="justify-self:start">${ic('book')}${esc(t.manual)} 기준</span>`;
  if(cur>=n){h+=vConfirm(t)+'</div>';setCta(`<button class="btn big" data-act="jump" data-i="${n-1}">이전</button><button class="btn primary big" data-act="finish">끝내기</button>`);return h;}
  const s=t.steps[cur],e=effLv(t,cur),choosing=t.status==='todo'&&cur===0&&!t.lvSet;
  if(!choosing&&(s.helpLv??-1)<e){s.helpLv=e;save();}
  if(all){
    h+=`<ol class="proc" aria-label="전체 과정">${t.steps.map((st,i)=>{const k=i<cur?'done':i===cur?'cur':'next',key=`p-${t.id}-${i}`,open=i===cur||ui.openSet.has(key);
      return `<li class="pstep ${k}"><details data-open="${key}" ${open?'open':''}><summary><span class="pnum">${i<cur?ic('check'):i+1}</span><span class="ptitle">${esc(st.title)}</span><span class="pill ${k==='done'?'ok':k==='cur'?'brand':'gray'}">${k==='done'?'했어요':k==='cur'?'지금':'다음'}</span>${ic('right','dchev')}</summary>
      <div class="pbody">${st.src?`<span class="src" style="justify-self:start">${ic('book')}${esc(st.src)}</span>`:''}${stepBody(t,i)}${i===cur?peekRow(t,e)+issuesHtml()+helpHtml(t,st):''}${i<cur?`<button class="btn small" style="justify-self:start" data-act="jump" data-i="${i}">${ic('left')}이 단계로 돌아가기</button>`:''}</div></details></li>`;}).join('')}</ol>`;
  }else{
    h+=`<section class="stephead"><div class="spot">${ic(s.pic)}</div><span class="small sub">${cur+1}단계</span><h2 id="sth" tabindex="-1">${esc(s.title)}</h2>${s.src?`<span class="src">${ic('book')}${esc(s.src)}</span>`:''}</section>`;
    h+=stepBody(t,cur)+peekRow(t,e)+issuesHtml()+helpHtml(t,s);
  }
  h+='</div>';
  setCta(`<button class="btn big" data-act="prev" ${cur===0?'disabled':''}>이전</button><button class="btn primary big" data-act="next">${cur===n-1?'마지막 확인하기':'다음 단계로'}</button>`);
  return h;}
const LV_ICON=['star','spark','list'],LV_SUB=['적을 칸만','한 줄 힌트','순서 전부'];
function lvPicker(t){const sug=suggestLv(t),last=lastAttempt(taskKey(t));

  ${det('lv-what','안내 정도가 뭐예요?',`<ul class="genlist">${[2,1,0].map(n=>`<li><b>${LEVELS[n].label}</b>: ${esc(LEVELS[n].desc)}</li>`).join('')}</ul><p class="small sub">하는 중에도 위의 ‘안내’ 버튼으로 언제든 바꿀 수 있어요.</p>`)}</section>`;}
/* 한 단계의 내용: 이렇게 해요 / 조심해요(늘 보여요) / 예시(펼쳐 보기) / 적어 둬요 / 체크 */
function stepBody(t,si){
  const s=t.steps[si],e=effLv(t,si);let h='';
  const longEx=s.ex&&String(s.ex.text).length>60;
  if(e>=2){
    if(s.how.length){const first=s.how.slice(0,2),rest=s.how.slice(2);
      h+=`<section class="blk blk-do"><span class="blk-h">${ic('list')}이렇게 해요</span><ol class="how">${first.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>${rest.length?det(`rest-${t.id}-${si}`,'나머지 순서 보기',`<ol class="how" start="3">${rest.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`):''}</section>`;}
  }else if(e===1){
    h+=`<section class="blk blk-do"><span class="blk-h">${ic('spark')}힌트</span><p class="blk-main">${esc(s.hint||s.how[0]||'단계 이름을 보고 할 일을 떠올려 봐요.')}</p></section>`;
  }
  if(e>=1&&s.tip)h+=`<section class="blk blk-warn" role="note"><span class="blk-h">${ic('warn')}조심해요</span><p class="blk-main">${esc(s.tip)}</p></section>`;
  if(e>=2&&s.ex&&!longEx)h+=`<section class="blk blk-say"><div class="row between"><span class="blk-h">${ic('talk')}${esc(s.ex.label)}</span>${copyBtn(s.ex.text)}</div><p class="extext">${esc(s.ex.text)}</p></section>`;
  if(e>=1){const more=[];
    let ex='';
    if(s.exam)ex+=`<p>${esc(s.exam)}</p>`;
    if(s.ex&&(e===1||longEx))ex+=`<div class="exbox"><div class="row between"><span class="lbl">${esc(s.ex.label)}</span>${copyBtn(s.ex.text)}</div><p class="extext">${esc(s.ex.text)}</p></div>`;
    const phs=(s.fields||[]).filter(f=>f.ph);
    if(!ex&&phs.length)ex=`<ul class="genlist">${phs.map(f=>`<li>${esc(f.label)}: ${esc(String(f.ph).replace(/^예:\s*/,''))}</li>`).join('')}</ul>`;
    if(ex)more.push(det(`ex-${t.id}-${si}`,'예시 보기',ex));
    if(s.why)more.push(det(`why-${t.id}-${si}`,'왜 필요해요?',`<p>${esc(s.why)}</p>`));
    if(more.length)h+=`<div class="more">${more.join('')}</div>`;}
  if(s.spell)h+=`<button class="btn soft" data-act="goSpell">${ic('spell')}맞춤법 검사하기</button>`;
  if(s.fields.length)h+=`<section class="card stack"><span class="blk-h">${ic('pen')}적어 둬요</span>${s.fields.map((f,fi)=>fieldHtml(t,si,f,fi,e)).join('')}</section>`;
  if(s.checks.length)h+=`<section class="stack" style="gap:8px"><span class="blk-h">${ic('check')}다 했으면 체크해요</span>${s.checks.map((c,i)=>{const hp=(s.checkHelp||[])[i];
    return `<label class="check ck2"><input type="checkbox" id="ck-${t.id}-${si}-${i}" data-bind="check" data-step="${si}" data-i="${i}" ${s.checked[i]?'checked':''}><span class="ckt"><span>${esc(c)}</span>${hp&&e>=1?`<span class="ckh">${ic('search')}${esc(hp)}</span>`:''}</span></label>`;}).join('')}</section>`;
  return h;}
function peekRow(t,e){if(e>=2)return '';
  return `<div class="peek">${e===0?`<button class="btn small soft" data-act="peek" data-n="1">${ic('spark')}힌트 보기</button>`:''}<button class="btn small soft" data-act="peek" data-n="2">${ic('list')}자세히 보기</button></div>`;}
function issuesHtml(){if(!(ui.issues&&ui.issues.length))return '';const w=ui.issues.every(x=>x.warn);
  return `<div class="note warn" role="alert">${ic('warn')}<div><b>${w?'한 번 더 확인해요':'아직 남은 게 있어요'}</b><ul style="margin:0;padding-left:1.1rem">${ui.issues.map(x=>`<li>${esc(x.msg)}</li>`).join('')}</ul><div class="row" style="margin-top:6px"><button class="btn small primary" data-act="fixIssue">고칠게요</button><button class="btn small" data-act="skipIssue">맞아요, 넘어갈게요</button></div></div></div>`;}
function fieldHtml(t,si,f,fi,e=2){const id=`f-${t.id}-${si}-${fi}`;
  const type={number:'text',tel:'tel',email:'email',date:'date'}[f.type]||'text';
  const h=histFor(t,f);

const CHAT_GUIDE=`[질문 종류마다 답하는 방법]
먼저 사용자의 말이 아래 셋 중 무엇인지 알아보고 그 틀로 답해요. 섞여 있으면 필요한 틀을 함께 써요.

1) 업무 질문 (일하는 방법, 회사 말, 서류, 메일, 순서)
- 바로 따라 할 수 있게 번호를 붙여 차례대로 써요. 5개 이하예요.
- 일을 대신 끝내 주지 말고, 사용자가 직접 할 수 있게 순서와 잘했는지 확인하는 방법을 알려 줘요. 사용자가 원하면 예시를 보여 줘요.
- 회사 매뉴얼이 있으면 매뉴얼을 먼저 따라요.

2) 말 뜻 풀기 (누가 한 말의 진짜 뜻이 궁금할 때: 돌려 말하기, 농담, 빈말, 눈치로 알아야 하는 말, 말투)
아래 줄을 이 순서로, 줄 앞에 이모티콘을 붙여 써요.
💬 들은 말: 사용자가 들은 말을 그대로 옮겨요.
🔍 보통 이런 뜻이에요: 직장에서 가장 흔한 뜻을 한두 문장으로 써요.
🤔 이런 뜻일 수도 있어요: 다른 가능성이 있으면 하나만 써요.
✅ 이렇게 하면 돼요: 지금 할 행동 1~2개를 써요.
🗣️ 이렇게 말해 봐요: 상대에게 할 말 한 문장을 써요.
- 자주 나오는 예: "알아서 해 봐요"는 먼저 해 보고 중간에 보여 달라는 뜻일 때가 많아요. "시간 될 때 해 줘요"는 보통 오늘이나 내일 안에 해 달라는 뜻이에요. "괜찮아요"는 정말 괜찮을 수도 있고, 거절일 수도 있어요. "언제 밥 한번 먹어요"는 인사말일 때가 많아요.
- 확실하지 않으면 아는 척하지 말고, 상대에게 확인하는 질문을 알려 줘요.

3) 관계 고민 (동료나 상사와의 사이, 서운함, 무시당한 것 같은 느낌, 다툼, 오해)
아래 줄을 이 순서로, 줄 앞에 이모티콘을 붙여 써요. 사람마다 마음을 감정 이모티콘(😊 🙂 😢 😠 😓 😳 🤔)으로 보여 주면 이해하기 쉬워요.
💛 마음 알아주기: 사용자의 감정을 한 문장으로 알아줘요. 예: 그 말을 듣고 속상했겠어요 😢
📋 있었던 일: 눈으로 보고 귀로 들은 사실만 써요.
💭 내가 느낀 것: 사용자가 그렇게 생각한 까닭을 써요. 사실과 생각을 나눠서 보여 줘요.
👀 상대 쪽에서 보면: 상대가 그렇게 한 다른 까닭을 1~2개 써요. 예: 바빠서 😓, 못 들어서 🙉
✅ 이렇게 해 봐요: 작고 쉬운 행동 1~2개를 써요.
🗣️ 이렇게 말해 봐요: 부드럽게 확인하는 말 한 문장을 써요. 상대를 탓하는 말 대신 "저는 ~해서 ~했어요"처럼 내 마음을 말하는 문장으로 써요.
- 어느 한쪽 편을 들지 않고 객관적으로 말해요. 상대를 나쁜 사람으로 단정하지 않고, 사용자를 탓하지도 않아요.
- 남의 마음을 다 아는 것처럼 말하지 않아요. "~일 수 있어요", "~일 때가 많아요"처럼 말해요.
- 욕설, 따돌림, 계속 무시하기, 개인 심부름처럼 괴롭힘일 수 있으면 참으라고 하지 않아요. 날짜와 내용을 적어 두고, 믿을 수 있는 사람이나 고용노동부 1350에 물어보라고 알려요.
- 사용자가 많이 힘들어 보이면 혼자 참지 말고 믿을 수 있는 사람과 이야기하라고 알려요.

[공통]
- 앞의 대화를 기억하고 이어서 답해요.
- 🗣️ 줄에서 상사나 선배에게 하는 말은 "~습니다", "~주실 수 있을까요?"처럼 공손하게 써요. 이 줄은 높임말 규칙의 예외예요.
- 상황 설명이 적으면 먼저 답하고, 마지막에 한 번만 "누가, 언제, 어떤 말투로 했는지 알려 주면 더 정확하게 알려 줄 수 있어요."라고 물어요.
- 한 줄은 짧게, 전체는 12줄 이내로 써요.`;

/* 나의 사무실: 아이소메트릭(입체) 그림. 역량 레벨(L)에 따라 사물이 생기고 자라요.
   좌표: x = 오른쪽 벽을 따라, y = 왼쪽 벽을 따라, z = 높이. 면마다 명암을 달리해 입체감을 줘요. */
function room(L){

  const S=1.8,OX=172,OY=146,W=120,D=84,H=67,T=4;
  const P=(x,y,z)=>[OX+(x-y)*0.866*S,OY+(x+y)*0.5*S-z*S];
  const pts=a=>a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const poly=(a,f,ex='')=>`<polygon points="${pts(a)}" fill="${f}" ${ex}/>`;
  const sh=(hex,f)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,mix=(v)=>Math.round(f>=0?v+(255-v)*f:v*(1+f));return '#'+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,'0')).join('');};
  const box=(x,y,z,w,dd,h,col,o2={})=>{
    const top=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+dd,z+h),P(x,y+dd,z+h)],fx=[P(x+w,y,z),P(x+w,y+dd,z),P(x+w,y+dd,z+h),P(x+w,y,z+h)],fy=[P(x,y+dd,z),P(x+w,y+dd,z),P(x+w,y+dd,z+h),P(x,y+dd,z+h)];
    return poly(fy,sh(col,o2.l??-0.05))+poly(fx,sh(col,o2.r??-0.2))+poly(top,sh(col,o2.t??0.08));};
  const onL=(y1,y2,z1,z2,f,ex)=>poly([P(0.3,y1,z1),P(0.3,y2,z1),P(0.3,y2,z2),P(0.3,y1,z2)],f,ex);
  const onR=(x1,x2,z1,z2,f,ex)=>poly([P(x1,0.3,z1),P(x2,0.3,z1),P(x2,0.3,z2),P(x1,0.3,z2)],f,ex);
  const ring=(cx,cy,cz,r,plane,f,ex='')=>{const a=[];for(let i=0;i<24;i++){const th=i/24*Math.PI*2,u=Math.cos(th)*r,v=Math.sin(th)*r;
    a.push(plane==='z'?P(cx+u,cy+v,cz):plane==='y'?P(cx+u,cy,cz+v):P(cx,cy+u,cz+v));}return poly(a,f,ex);};
  const shadow=(cx,cy,rx,ry)=>{const a=[];for(let i=0;i<20;i++){const th=i/20*Math.PI*2;a.push(P(cx+Math.cos(th)*rx,cy+Math.sin(th)*ry,0));}return poly(a,'#1B3A66','opacity=".14"');};
  const BOOK=['#0072B2','#D55E00','#E69F00','#009E73','#CC79A7','#56B4E9','#8C6BB1','#4A5568'];
  const items=[];
  let s=`<svg viewBox="0 0 400 340" role="img" aria-label="ROOMLABEL"><defs>
   <linearGradient id="rm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D6F3"/><stop offset="1" stop-color="#8DB8E8"/></linearGradient>
   <linearGradient id="rm-wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E9F1"/></linearGradient>
   <linearGradient id="rm-wr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2F7"/><stop offset="1" stop-color="#D6DEE9"/></linearGradient>
   <linearGradient id="rm-fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EAEE6"/><stop offset="1" stop-color="#5B8FD6"/></linearGradient></defs>
   <rect width="400" height="340" rx="18" fill="url(#rm-bg)"/>`;
  // 바닥과 벽 (두께가 보이는 단면)
  s+=box(-T,-T,-6,W+T,D+T,6,'#5B8FD6',{t:0,l:-0.18,r:-0.3});
  s+=poly([P(0,0,0),P(W,0,0),P(W,D,0),P(0,D,0)],'url(#rm-fl)');
  s+=box(-T,-T,0,W+T,T,H,'#EEF2F7',{l:-0.1,r:-0.12,t:0.6});
  s+=poly([P(0,0.01,0),P(W,0.01,0),P(W,0.01,H),P(0,0.01,H)],'url(#rm-wr)');

function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
const realLogs=()=>S.logs.filter(l=>!l.example);
function attemptsByKey(){const m={};realLogs().slice().sort((a,b)=>a.doneAt-b.doneAt).forEach(l=>{const k=logKey(l);(m[k]=m[k]||{title:l.title,list:[]}).list.push(l);m[k].title=l.title;});return m;}
const FEEL=['혼자 할 수 있었어요','조금 도움이 필요했어요','많이 어려웠어요'];
function goalTitle(g){return g.kind==='lv'?`‘${g.title}’를 ‘${lvName(g.target)}’로 끝내기`:g.kind==='week'?`이번 주에 일 ${g.n}개 끝내기`:'처음 하는 일 하나 해 보기';}
function goalState(g){const after=realLogs().filter(l=>l.doneAt>=g.createdAt);
  if(g.kind==='lv'){const hit=after.filter(l=>logKey(l)===g.key&&l.lvMain!=null&&l.lvMain<=g.target).sort((a,b)=>a.doneAt-b.doneAt)[0];
    const last=lastAttempt(g.key);return{done:!!hit,at:hit&&hit.doneAt,cur:hit?1:0,need:1,note:hit?'':last?`가장 최근: ‘${lvName(last.lvMain)}’ (${dayLabel(last.doneAt)})`:'아직 기록이 없어요'};}
  if(g.kind==='week'){const ws=weekStart(Date.now()),c=realLogs().filter(l=>l.doneAt>=ws).length;return{done:c>=g.n,cur:Math.min(c,g.n),need:g.n,note:`이번 주 ${c}개`};}
  const hit=after.filter(l=>l.first).sort((a,b)=>a.doneAt-b.doneAt)[0];return{done:!!hit,at:hit&&hit.doneAt,cur:hit?1:0,need:1,note:hit?`‘${hit.title}’`:'할 일 추가에서 안 해 본 일을 골라 봐요'};}
function goalSuggestions(){const att=attemptsByKey(),out=[];
  Object.entries(att).forEach(([k,v])=>{const last=[...v.list].reverse().find(l=>l.lvMain!=null);
    if(last&&last.lvMain>0&&!S.goals.some(g=>g.kind==='lv'&&g.key===k))out.push({kind:'lv',key:k,title:v.title,target:last.lvMain-1});});
  const s=out.slice(0,3);
  if(!S.goals.some(g=>g.kind==='week'))s.push({kind:'week',n:3});
  if(!S.goals.some(g=>g.kind==='new'))s.push({kind:'new'});
  return s;}
function growFeedback(){const out=[],att=attemptsByKey(),L=realLogs();
  Object.values(att).forEach(v=>{const w=v.list.filter(l=>l.lvMain!=null);if(w.length>=2){const a=w[0],b=w[w.length-1];
    if(b.lvMain<a.lvMain)out.push(`‘${v.title}’를 처음에는 ‘${lvName(a.lvMain)}’로, 가장 최근(${dayLabel(b.doneAt)})에는 ‘${lvName(b.lvMain)}’로 끝냈어요.`);
    else if(b.lvMain>a.lvMain)out.push(`‘${v.title}’는 가장 최근에 ‘${lvName(b.lvMain)}’로 했어요. 필요할 때 자세한 안내를 고르는 것도 좋은 방법이에요.`);}});
  const fixedN=L.filter(l=>l.fixed>0).length;if(fixedN)out.push(`실수 확인에서 고칠 곳을 찾아 고친 적이 ${fixedN}번 있어요.`);
  const hard={};L.forEach(l=>{(l.reflect&&l.reflect.hard||[]).forEach(st=>{const k=l.title+'|'+st;hard[k]=(hard[k]||0)+1;});});
  Object.entries(hard).filter(([,n])=>n>=2).slice(0,2).forEach(([k,n])=>{const [ti,st]=k.split('|');out.push(`‘${ti}’의 ‘${st}’ 단계를 ${n}번 어렵다고 적었어요. 다음에는 그 단계에서 ‘이 단계가 필요한 이유’와 ‘예시 보기’를 먼저 펼쳐 봐요.`);});
  return out.slice(0,4);}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',MAMMOTH='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
async function readPdf(file){
  if(!window.pdfjsLib)await loadScript(PDFJS);
  if(!window.pdfjsWorker){try{await loadScript(PDFW);}catch(e){}}
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let out='';
  for(let p=1;p<=doc.numPages&&out.length<MAXM;p++){ui.man.msg=`PDF ${p}/${doc.numPages}쪽 읽는 중`;const el=document.querySelector('#view .thinking');if(el&&el.firstChild)el.firstChild.textContent=ui.man.msg+' ';
    const tc=await (await doc.getPage(p)).getTextContent();out+=`\n[${p}쪽]\n`+tc.items.map(i=>i.str+(i.hasEOL?'\n':'')).join(' ');}
  return out;}
async function readDocx(file){if(!window.mammoth)await loadScript(MAMMOTH);const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value||'';}
async function readImage(file){if(!AI||!aiImages)throw{code:'images_unavailable'};
  const {text}=await AI('이 사진은 회사 업무 매뉴얼이에요. 사진 속 글을 빠짐없이 그대로 옮겨 적어요. 표는 한 줄씩 풀어서 적어요. 설명은 붙이지 말고 옮긴 글만 써요.',{images:[file],cache:false});return text;}
async function extractText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();let text='',kind='doc';
  if(ext==='pdf')text=await readPdf(file);
  else if(ext==='docx')text=await readDocx(file);
  else if(['txt','md','csv'].includes(ext))text=await file.text();
  else if(/^image\//.test(file.type)){kind='image';ui.man.msg='AI가 사진 속 글을 읽고 있어요';rerenderKeep();text=await readImage(file);}
  else if(ext==='hwp'||ext==='hwpx')throw{msg:'한글 파일은 PDF로 저장해서 넣어 주세요.'};
  else throw{msg:'PDF, Word, 텍스트 파일을 넣어 주세요.'};
  text=text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<20)throw{msg:ext==='pdf'?'PDF에서 글자를 찾지 못했어요. 스캔한 PDF는 사진으로 넣어 주세요.':'읽을 글자가 너무 적어요.'};
  return{text,kind,ext};}
const fileErr=e=>e&&e.msg?e.msg:e&&e.code?aiErr(e):'파일을 읽지 못했어요. 다른 파일로 다시 해 주세요.';
async function addManualFile(file){

async function saveManual(name,text,kind='doc'){

function sanitizeSteps(arr){if(!Array.isArray(arr))return null;
  const out=arr.slice(0,7).map(s=>({title:String(s&&s.title||'').slice(0,30),pic:PIC_NAMES.includes(s&&s.pic)?s.pic:'check',
    how:Array.isArray(s&&s.how)?s.how.slice(0,4).map(x=>String(x).slice(0,80)).filter(Boolean):[],tip:s&&s.tip?String(s.tip).slice(0,100):'',src:s&&s.src?String(s.src).slice(0,30):'',
    ex:s&&s.say?{label:'이렇게 말해요',text:String(s.say).slice(0,200)}:null,
    fields:Array.isArray(s&&s.fields)?s.fields.slice(0,3).filter(f=>f&&f.label).map((f,i)=>({k:'f'+i,label:String(f.label).slice(0,24),type:['text','number','date'].includes(f.type)?f.type:'text',unit:f.unit?String(f.unit).slice(0,6):''})):[],
    checks:Array.isArray(s&&s.checks)?s.checks.slice(0,3).map(x=>String(x).slice(0,40)).filter(Boolean):[],
    checkHelp:Array.isArray(s&&s.checkHelp)?s.checkHelp.slice(0,3).map(x=>String(x).slice(0,90)):[],why:s&&s.why?String(s.why).slice(0,100):''})).filter(s=>s.title);
  return out.length?out:null;}
const STEP_FORMAT=`JSON 하나로만 답해요. 형식:
{"skill":"doc|plan|team|comm|office|money 중 하나","steps":[{"title":"단계 이름(10자 안팎, ~하기)","pic":"그림 이름","how":["짧은 문장(15자 안팎)","최대 3개"],"tip":"가장 흔한 실수를 막는 한 문장(없으면 빈 문자열)","say":"말할 문장이 필요하면(없으면 빈 문자열)","src":"매뉴얼 근거(예: 매뉴얼 3쪽, 없으면 빈 문자열)","why":"이 단계가 왜 필요한지 한 문장","fields":[{"label":"적어 둘 것","type":"text|number|date","unit":"개"}],"checks":["했는지 확인할 것(~했어요)"],"checkHelp":["checks와 같은 순서로, 무엇을 보고 체크하면 되는지 한 문장"]}]}
그림 이름은 이 중에서 골라요: ${PIC_NAMES.join(', ')}
단계는 3~6개, fields와 checks는 꼭 필요한 것만 0~2개.`;
async function genStepsAI(title,ctx,baseSteps){
  const mc=await manualContext(title+' '+(ctx||''),14000);
  let prompt=`${EASY}\n\n사무실 업무 '${title}'를 실수 없이 하도록 단계로 나눠 줘요.${ctx?'\n사용자가 아는 내용: '+ctx:''}`;
  if(baseSteps)prompt+=`\n기본 단계: ${baseSteps.map((s,i)=>`${i+1}. ${s.title}(${s.how.join(' ')})`).join(' / ')}`;
  if(mc)prompt+=`\n\n[회사 매뉴얼 — 가장 먼저 따라요]\n${mc.text}\n\n매뉴얼에 이 업무 방법이 있으면 매뉴얼 순서와 용어를 그대로 따르고, 각 단계 src에 근거를 적어요. 매뉴얼과 기본 방법이 다르면 매뉴얼을 따라요. 매뉴얼에 없는 내용은 지어내지 말고, 꼭 필요한 일반 단계만 넣어요.`;
  prompt+=`\n\n${STEP_FORMAT}`;
  const r=await AI.json(prompt);const st=sanitizeSteps(r&&r.steps);if(!st)throw{code:'invalid_json'};
  const used=!!(mc&&st.some(s=>s.src));
  return{steps:st,skill:SKILLS[r.skill]?r.skill:guessSkill(title),src:mc?(used?`매뉴얼(${mc.names.join(', ')})을 보고 만들었어요.`:'매뉴얼에 없는 업무라서 기본 방법으로 만들었어요.'):'',manual:used?mc.names[0]:null};}

      A.p={id:null,title,skill:SKILLS[r.skill]?r.skill:guessSkill(title),steps:toEditable(st),src:g?`‘${g.name}’ 지침을 보고 만든 초안이에요. 저장 전에 확인해 주세요.`:'AI가 만든 초안이에요. 우리 회사 방식에 맞게 고쳐 주세요.'};}
    catch(e){A.pErr=aiErr(e);}
    A.pBusy=false;if(A.p){go('a_procs');}else rerenderKeep();},
  aTogglePaste(){ui.adm.g.pasteOpen=!ui.adm.g.pasteOpen;rerenderKeep();},
  async aSavePaste(){const G=ui.adm.g;if(G.text.trim().length<20){toast('내용을 조금 더 넣어 주세요.');return;}
    if(await saveGuide(G.name.trim()||'회사 지침',G.text.trim().replace(/\n{3,}/g,'\n\n'))){G.pasteOpen=false;G.name='';G.text='';}rerenderKeep();},
  async aDelGuide(d){ui.confirm=null;const g=ORG.guides.find(x=>x.id===d.id);
    if(await orgDel(ORGP()+'/guides/'+d.id)){await orgDel(ORGP()+'/gtext/'+d.id);if(g&&g.assetId&&ASSETS){try{await ASSETS.delete(g.assetId);}catch(e){}}toast('지침을 지웠어요.');}
    rerenderKeep();},
  async aAddMeet(){const M=ui.adm.m,title=M.title.trim(),date=M.date||todayStr();
    if(!title){toast('회의 이름을 적어 주세요.');$('#a-m-title')&&$('#a-m-title').focus();return;}
    if(await orgWrite(ORGP()+'/meetings/'+uid(),{title:title.slice(0,40),date,time:M.time||'',place:M.place.trim().slice(0,40),prep:M.prep.trim().slice(0,300),to:M.to||'all',createdAt:Date.now()})){
      Object.assign(M,{title:'',date:'',time:'10:00',place:'',prep:''});rerenderKeep();toast('회의를 넣었어요.');}},
  async aDelMeet(d){ui.confirm=null;if(await orgDel(ORGP()+'/meetings/'+d.id))toast('회의를 지웠어요.');rerenderKeep();},
  goAsk(d){ui.askTab=d.t||'chat';ui.confirm=null;go('ask');},
  goalOpen(){ui.goalOpen=!ui.goalOpen;rerenderKeep();},
  goalAdd(d){if(S.goals.length>=3){toast('목표는 3개까지 정할 수 있어요.');return;}
    S.goals.push({id:uid(),kind:d.kind,key:d.key||'',title:d.title||'',target:d.target===''?null:+d.target,n:d.n?+d.n:0,createdAt:Date.now()});ui.goalOpen=false;save();rerenderKeep();toast('목표를 정했어요.');},
  goalDel(d){S.goals=S.goals.filter(g=>g.id!==d.id);save();rerenderKeep();},
  toggleShare(){S.settings.shareProgress=!S.settings.shareProgress;save();pushProgress(true);rerenderKeep();toast(S.settings.shareProgress?'상사에게 진행 상황을 보여 줘요.':'진행 상황을 보내지 않아요.');},
  acctSignIn(){WEAVE_ACCOUNT.signIn();},
  acctSwitch(){WEAVE_ACCOUNT.switchCompany();},
  acctOut(){WEAVE_ACCOUNT.signOut();},
  // 성장
  togglePreview(){ui.previewRoom=!ui.previewRoom;rerenderKeep();},
  report(){ui.report=makeReport();rerenderKeep();},
  askDelLog(d){ui.confirm='log-'+d.id;rerenderKeep();},
  delLog(d){S.logs=S.logs.filter(l=>l.id!==d.id);ui.confirm=null;save();rerenderKeep();toast('기록을 지웠어요.');},
  // 설정
  toggleAutoAdd(){S.settings.autoAdd=!S.settings.autoAdd;save();rerenderKeep();},
  delMem(d){S.memory.splice(+d.i,1);save();rerenderKeep();},
  clearDone(){const n=S.tasks.filter(t=>t.status==='done').length;S.tasks=S.tasks.filter(t=>t.status!=='done');save();rerenderKeep();toast(n?`끝낸 일 ${n}개를 치웠어요.`:'치울 일이 없어요.');},
  askReset(){ui.confirm='reset';rerenderKeep();},
  async resetAll(){const ids=S.manuals.map(m=>m.id),keep=S.assigned;S=defaultState();S.assigned=keep;ui.confirm=null;ui.report=null;save();for(const id of ids)await delManualText(id);go('home');toast('처음 상태로 되돌렸어요.');}
};
function advance(){const t=curTask();ui.issues=null;t.changed=false;
  const s=t.steps[t.current],e=effLv(t,t.current);if((s.helpLv??-1)<e)s.helpLv=e;
  s.done=true;t.current++;if(t.status==='todo')t.status='doing';ui.peek=0;save();
  ui.help=freshHelp();stopSpeak();render();
  if(S.settings.taskView==='all'){const c=document.querySelector('.pstep.cur');if(c)c.scrollIntoView({block:'start'});else window.scrollTo(0,0);}else window.scrollTo(0,0);
  const h=$('#sth')||document.querySelector('.pstep.cur summary');if(h)h.focus({preventScroll:true});}
function logTask(t,xp,info={}){const values=[];t.steps.forEach(s=>s.fields.forEach(f=>{const v=String(f.value||'').trim();if(v)values.push({label:f.label,value:f.type==='number'?fmtNum(v):v,unit:f.unit||''});}));
  const counts={0:0,1:0,2:0};(info.lv||[]).forEach(n=>{counts[n]=(counts[n]||0)+1;});
  const log={id:uid(),title:t.title,key:taskKey(t),skill:t.skill,doneAt:Date.now(),values,xp,example:t.example,
    lvCounts:counts,lvMain:(info.lv&&info.lv.length)?mainLv(counts):null,helped:!!t.helped,fixed:t.fixed||0,first:!!info.first,steps:t.steps.length};
  S.logs.unshift(log);if(S.logs.length>300)S.logs.length=300;
  t.steps.forEach(s=>s.fields.forEach(f=>{if(f.hist&&f.type==='number'){const k=histKey(t,f),n=num(f.value);if(k&&!isNaN(n)&&String(f.value).trim()){const a=(S.history[k]=S.history[k]||[]);a.push(n);if(a.length>5)a.shift();}}}));
  return log;}

/* ---------- AI 대화 (기억 + 할 일 자동 추가) ---------- */
function addTaskFromChat(msg,title,due,urgent){title=String(title||'').trim().slice(0,40);if(!title)return{ok:false,reason:'이름이 비어 있어요'};
  if(S.tasks.some(t=>t.status!=='done'&&normTitle(t.title)===normTitle(title)))return{ok:false,reason:'이미 목록에 있어요'};
  const t=quickTask(title,String(due||'').trim()||'오늘 안에',!!urgent);t.fromChat=true;S.tasks.push(t);S.settings.onboarded=true;
  msg.added=msg.added||[];msg.added.push({id:t.id,title});save();return{ok:true};}
function rememberFact(msg,fact){fact=String(fact||'').trim().slice(0,80);if(!fact)return{ok:false};
  if(!S.memory.includes(fact)){S.memory.push(fact);if(S.memory.length>30)S.memory.shift();msg.mem=msg.mem||[];msg.mem.push(fact);save();}return{ok:true};}
async function chatSend(){
  const text=(ui.chatDraft||'').trim();if(!text||ui.chatBusy||aiState!=='ready')return;
  if(S.chat.length>78)S.chat.splice(0,S.chat.length-78);
  S.chat.push({role:'user',content:text,ts:Date.now()});ui.chatDraft='';ui.chatBusy=true;
  const msg={role:'assistant',content:'',ts:Date.now(),pending:true,added:[],mem:[]};S.chat.push(msg);const idx=S.chat.length-1;
  rerenderKeep();scrollChat();
  const mc=await manualContext(text,6000);
  const open=openTasks().slice(0,12).map(t=>`- ${t.title} (${t.due})`).join('\n')||'- 없음';
  const sys=`${EASY}\n\n[사용자]\n이름: ${S.settings.name||'모름'}\n기억한 것:\n${S.memory.map(m=>'- '+m).join('\n')||'- 없음'}\n지금 할 일 목록:\n${open}\n다가오는 회의:\n${upcomingMeets().slice(0,5).map(m=>`- ${m.title} (${fmtDate(parseYMD(m.date)||new Date())} ${fmtHM(m.time)}${m.place?', '+m.place:''})${m.prep?' 준비할 것: '+m.prep:''}`).join('\n')||'- 없음'}${mc?`\n\n[회사 매뉴얼 — 업무 방법을 답할 때 먼저 따라요]\n${mc.text}`:''}\n\n[규칙]\n- 앞의 대화를 기억하고 이어서 답해요.\n${S.settings.autoAdd&&aiTools?'- 사용자가 직접 해야 할 업무를 말하면 add_task로 할 일에 넣고, 넣었다고 짧게 알려요. 이미 목록에 있으면 넣지 않아요.\n':''}${aiTools?'- 사용자에 대한 오래 쓸 정보(부서, 상사 이름, 자주 하는 일)를 알게 되면 remember로 저장해요.\n':''}- 직장 내 권리 질문에는 일반적인 기준만 알려 주고, 정확한 건 고용노동부 1350에 물어보라고 해요.\n\n${CHAT_GUIDE}`;
  const hist=S.chat.slice(0,-1).filter(m=>m.content&&!m.err).slice(-16).map(m=>({role:m.role,content:m.content}));
  const turns=[{role:'user',content:sys},...hist];
  ui.chatCtl=new AbortController();
  const opts={modelTier:'default',signal:ui.chatCtl.signal,onText:({text})=>{msg.content=text;const el=document.querySelector(`[data-msg="${idx}"] .bub-body`);if(el)el.innerHTML=md(text);}};
  if(aiTools){opts.tools=[
    {name:'remember',description:'사용자에 대한 오래 쓸 정보를 한 문장으로 저장해요. 예: "부서는 총무팀이에요".',inputSchema:{type:'object',properties:{fact:{type:'string'}},required:['fact']},execute:(i)=>rememberFact(msg,i.fact)},
    {name:'list_tasks',description:'사용자의 끝나지 않은 할 일 목록을 돌려줘요.',execute:()=>openTasks().map(t=>({title:t.title,due:t.due,step:`${Math.min(t.current,t.steps.length)}/${t.steps.length}`}))}];
    if(S.settings.autoAdd)opts.tools.unshift({name:'add_task',description:'사용자가 해야 할 업무를 할 일 목록에 넣어요. 결과로 ok를 돌려줘요.',inputSchema:{type:'object',properties:{title:{type:'string',description:'15자 안팎, ~하기'},due:{type:'string',description:'언제까지. 모르면 빈 문자열'},urgent:{type:'boolean'}},required:['title']},execute:(i)=>addTaskFromChat(msg,i.title,i.due,i.urgent)});}
  else opts.cache=false;
  try{await AI(turns,opts);}
  catch(e){if(e&&e.text)msg.content=e.text;if(e&&e.code==='cancelled'){if(!msg.content&&!msg.added.length)S.chat.splice(idx,1);}else msg.err=aiErr(e);}
  msg.pending=false;ui.chatBusy=false;ui.chatCtl=null;
  if(!aiTools&&S.settings.autoAdd&&msg.content&&!msg.err){
    try{const r=await AI.json(`사용자 말: "${text}"\n이 말에서 사용자가 직접 해야 할 업무가 있으면 뽑아요. 없으면 빈 배열이에요. 사용자에 대한 오래 쓸 정보(부서, 상사 이름 등)도 뽑아요.\nJSON: {"tasks":[{"title":"15자 안팎, ~하기","due":"언제까지(모르면 빈 문자열)"}],"facts":["한 문장"]}`,{modelTier:'quick'});
      (Array.isArray(r&&r.tasks)?r.tasks.slice(0,3):[]).forEach(t=>addTaskFromChat(msg,t.title,t.due,false));
      (Array.isArray(r&&r.facts)?r.facts.slice(0,2):[]).forEach(f=>rememberFact(msg,f));}catch(e){}}
  save();if(ui.view==='ask'&&ui.askTab==='chat'){rerenderKeep();scrollChat();}
}
function scrollChat(){const c=$('#chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'center',behavior:'smooth'});}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el,e);}});

/* 펼쳐 보기를 열고 닫은 상태를 기억해요 (화면을 다시 그려도 그대로) */
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details[data-open]')){const k=d.dataset.open;if(d.open)ui.openSet.add(k);else ui.openSet.delete(k);}},true);
